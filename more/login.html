<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexcent - Login & Signup</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    .full-screen-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
      background-color: #fff;
    }

    .auth-card {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .form-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px;
    }

    .form-content {
      width: 100%;
      max-width: 500px;
    }

    .form-section h2 {
      font-size: 36px;
      margin-bottom: 12px;
      color: #111;
    }

    .subtitle {
      color: #666;
      margin-bottom: 40px;
      font-size: 18px;
    }

    .input-group {
      margin-bottom: 25px;
    }

    .input-group label {
      display: block;
      font-size: 16px;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
    }

    .forgot-pass {
      font-size: 14px;
      color: #4B6346;
      text-decoration: none;
    }

    .input-group input {
      width: 100%;
      padding: 18px;
      border: 1px solid #E5E5E5;
      border-radius: 14px;
      outline: none;
      font-size: 16px;
    }

    .checkbox-group {
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
    }

    .btn-primary {
      width: 100%;
      padding: 18px;
      background-color: #2D3E2F;
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 18px;
    }

    .divider {
      text-align: center;
      margin: 30px 0;
      position: relative;
    }

    .divider::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 1px;
      background: #eee;
      left: 0;
      top: 50%;
      z-index: 1;
    }

    .divider span {
      background: #fff;
      padding: 0 15px;
      position: relative;
      z-index: 2;
      color: #999;
      font-size: 16px;
    }

    .social-btns {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    .btn-social {
      flex: 1;
      padding: 15px;
      border: 1px solid #E5E5E5;
      background: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      font-size: 15px;
    }

    .footer-text {
      text-align: center;
      font-size: 16px;
      color: #666;
    }

    .footer-text a {
      color: #2D3E2F;
      text-decoration: none;
      font-weight: 600;
    }

    .image-section {
      flex: 1;
      margin: 30px;
      border-radius: 50px;
      background-image: url('./chris-lee-70l1tDAI6rM-unsplash\ 1.png');
      background-size: cover;
      background-position: center;
    }

    @media (max-width: 992px) {
      .image-section {
        display: none;
      }

      .form-content {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="full-screen-wrapper">
    <div class="auth-card">
      <div class="form-section">
        <div class="form-content">
          <h2>Welcome back!</h2>
          <p class="subtitle">Enter your Credentials to access your account</p>

          <form id="authForm">
            <div class="input-group">
              <label>Email address</label>
              <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
              <div class="label-row">
                <label>Password</label>
                <a href="#" class="forgot-pass">Forgot password?</a>
              </div>
              <input type="password" placeholder="••••••••" required>
            </div>

            <div class="checkbox-group">
              <input type="checkbox" id="remember">
              <label for="remember">Remember for 30 days</label>
            </div>

            <button type="submit" class="btn-primary">Login</button>

            <div class="divider"><span>or</span></div>

            <div class="social-btns">
              <button type="button" class="btn-social">Sign in with Google</button>
              <button type="button" class="btn-social">Sign in with Apple</button>
            </div>
          </form>

          <p class="footer-text">Don’t have an account? <a href="#">Sign up</a></p>
        </div>
      </div>

      <div class="image-section">
        <div class="image-overlay"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
